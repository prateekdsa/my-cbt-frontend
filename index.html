<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Public School, Najibabad - Secure Examination Portal</title>
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./dist/output.css">
    <!-- PDF.js and Mammoth CDNs for Document Parsing with Image/Figure Support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; user-select: none; }
        input, select, textarea { user-select: text; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        /* Ensure embedded figures, charts, and circuits scale nicely */
        .question-body img { max-width: 100%; height: auto; display: block; margin: 10px auto; border-radius: 8px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col" oncontextmenu="return false;">

    <!-- Anti-Cheat Security Warning Modal -->

            <div class="text-red-600 text-6xl mb-3">⚠️</div>
            <h3 class="text-2xl font-black text-red-700 tracking-wide mb-2">SECURITY WARNING!</h3>
            <p id="warning-text" class="text-slate-700 text-sm mb-6 font-medium leading-relaxed">Tab switching or leaving the examination window is strictly prohibited.</p>
            <button onclick="dismissWarning()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-2xl font-bold transition shadow-lg text-sm">I Understand & Return</button>
        </div>
    </div>

    <!-- Dynamic Modal Container -->
    <div id="app-modal" class="fixed inset-0 bg-slate-950/70 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-8 shadow-2xl border border-slate-200 relative max-h-[90vh] overflow-y-auto custom-scrollbar">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-700 font-black text-xl">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Main App Wrapper -->
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Header -->
        <header id="app-header" class="hidden bg-gradient-to-r from-blue-950 via-blue-900 to-indigo-950 text-white shadow-2xl p-4 md:px-8 flex justify-between items-center sticky top-0 z-40 border-b border-blue-800/50">
            <div class="flex items-center space-x-4">
                <div class="bg-white text-blue-950 font-black px-3 py-2 rounded-xl text-lg shadow-inner">CPS</div>
                <div>
                    <h1 class="font-extrabold text-base md:text-lg tracking-wide">CITY PUBLIC SCHOOL, NAJIBABAD</h1>
                    <p class="text-xs text-blue-300 font-medium">Secure CBT Examination Engine v6.1</p>
                </div>
            </div>
            <div id="header-user-info" class="text-sm font-medium flex items-center gap-4"></div>
        </header>

        <!-- Main Body -->
        <main class="flex-grow flex flex-col w-full">
            <div id="view-container" class="flex-grow flex flex-col"></div>
        </main>

        <!-- Footer -->
        <footer class="bg-slate-900 text-slate-400 text-xs py-5 text-center border-t border-slate-800 font-medium">
            &copy; 2026. All Rights Reserved. Designed by Krishna Kr. 
        </footer>

                    questions: [

                },

                    id: 'mathematics_all', subjectId: 'mathematics', name: 'Mathematics', subject: 'Mathematics', class: 'All Sections', status: 'LIVE', startTime: '', endTime: '', durationMinutes: 60,
                    questions: [
                        { id: 1, type: 'mcq', q: 'What is the value of Pi (π) up to 2 decimal places?', options: ['3.12', '3.14', '3.16', '3.18'], correct: 1 }

                },
                { 
                    id: 'biology_all', subjectId: 'biology', name: 'Biology', subject: 'Biology', class: 'All Sections', status: 'OFFLINE', startTime: '', endTime: '', durationMinutes: 45,
                    questions: [
                        { id: 1, type: 'mcq', q: 'Which cell organelle is known as the powerhouse of the cell?', options: ['Nucleus', 'Ribosome', 'Mitochondria', 'Golgi Apparatus'], correct: 2 }
                    ]
                }
            ],
            submissions: JSON.parse(localStorage.getItem('cps_submissions')) || []
        };

        function saveState() {
            localStorage.setItem('cps_users', JSON.stringify(state.users));
            localStorage.setItem('cps_exams', JSON.stringify(state.exams));
            localStorage.setItem('cps_submissions', JSON.stringify(state.submissions));
        }

        // Live Clock Timer for Login Screen
        setInterval(() => {
            const clockEl = document.getElementById('live-clock-badge');
            if (clockEl) {
                const now = new Date();
                const d = String(now.getDate()).padStart(2, '0');
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const y = now.getFullYear();
                const timeStr = now.toTimeString().split(' ')[0];
                clockEl.innerText = `${d}/${m}/${y} | ${timeStr}`;
            }
        }, 1000);

        // Multi-device / multi-tab session monitor for students
        setInterval(() => {
            if (state.currentUser && state.currentUser.role === 'Student') {
                const sessionKey = 'cps_active_session_' + state.currentUser.username;
                const currentStoredSession = localStorage.getItem(sessionKey);
                
                const freshUser = state.users.find(u => u.username === state.currentUser.username);
                if (freshUser && freshUser.status === 'locked') {
                    alert('Your account has been locked due to multi-device or multi-tab login attempt.');
                    logout();
                    return;
                }

                if (currentStoredSession && currentStoredSession !== state.currentUser.sessionToken) {
                    if (freshUser) freshUser.status = 'locked';
                    saveState();
                    alert('Security Alert: Your account has been accessed from another device or tab and is now locked immediately.');
                    logout();
                }
            }
        }, 1000);

        // Listen to storage events across tabs
        window.addEventListener('storage', (event) => {
            if (state.currentUser && state.currentUser.role === 'Student') {
                const sessionKey = 'cps_active_session_' + state.currentUser.username;
                if (event.key === sessionKey && event.newValue !== state.currentUser.sessionToken) {
                    alert('Security Alert: Account accessed from another tab/device. Locking account immediately.');
                    logout();
                }
            }
        });

        function render() {
            const container = document.getElementById('view-container');
            const header = document.getElementById('app-header');
            const userInfo = document.getElementById('header-user-info');

            if (!state.currentUser) {
                header.classList.add('hidden');
                container.innerHTML = renderLoginScreen();
                toggleStudentFields();
                return;
            }

            header.classList.remove('hidden');

            // Handle Student 30-Second Countdown Screen after login
            if (state.currentUser.role === 'Student' && state.showLoginCountdown) {
                userInfo.innerHTML = `
                    <div class="hidden md:block text-right">
                        <div class="font-bold text-white">${state.currentUser.name}</div>
                        <div class="text-xs text-blue-300 capitalize font-medium">${state.currentUser.role} | ${state.currentUser.class || 'System Control'}</div>
                    </div>
                    <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-md">Logout</button>
                `;
                container.innerHTML = `
                    <div class="flex-grow flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl max-w-lg w-full p-8 text-center shadow-2xl border border-slate-200 space-y-6 my-auto">
                            <div class="text-blue-950 text-5xl">⏳</div>
                            <h3 class="text-2xl font-black text-blue-950">Security Initialization & Verification</h3>
                            <p class="text-slate-600 text-sm font-medium">Exam session successfully authorized. Please wait for the secure examination environment countdown.</p>
                            <div id="login-countdown-timer" class="text-4xl font-black text-blue-600 py-4 bg-blue-50 rounded-2xl border border-blue-100">30s</div>
                            <button onclick="skipLoginCountdown()" class="w-full bg-blue-950 hover:bg-blue-900 text-white py-3.5 rounded-2xl font-bold transition text-sm shadow">Proceed to Portal Now</button>
                        </div>
                    </div>
                `;
                if (!window.loginCountdownInterval) {
                    let secondsLeft = 30;
                    window.loginCountdownInterval = setInterval(() => {
                        secondsLeft--;
                        const timerEl = document.getElementById('login-countdown-timer');
                        if (timerEl) timerEl.innerText = `${secondsLeft}s`;
                        if (secondsLeft <= 0) {
                            clearInterval(window.loginCountdownInterval);
                            window.loginCountdownInterval = null;
                            state.showLoginCountdown = false;
                            render();
                        }
                    }, 1000);
                }
                return;
            }

            let userSubjectLabel = state.currentUser.role === 'Teacher' ? ` | Subject: ${state.currentUser.subject.toUpperCase()}` : '';
            userInfo.innerHTML = `
                <div class="hidden md:block text-right">
                    <div class="font-bold text-white">${state.currentUser.name}</div>
                    <div class="text-xs text-blue-300 capitalize font-medium">${state.currentUser.role} | ${state.currentUser.class || 'System Control'}${userSubjectLabel}</div>
                </div>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-md">Logout</button>
            `;

            if (state.currentUser.role === 'Admin' || state.currentUser.role === 'Teacher') {
                container.innerHTML = `<div class="p-4 md:p-8 max-w-7xl mx-auto w-full">${renderManagementDashboard()}</div>`;
            } else {
                container.innerHTML = `<div class="p-4 md:p-8 max-w-4xl mx-auto w-full">${renderStudentPortal()}</div>`;
            }
        }

        function skipLoginCountdown() {
            if (window.loginCountdownInterval) {
                clearInterval(window.loginCountdownInterval);
                window.loginCountdownInterval = null;
            }
            state.showLoginCountdown = false;
            render();
        }

        function togglePasswordVisibility(fieldId, btnEl) {
            const inputField = document.getElementById(fieldId);
            if (inputField) {
                if (inputField.type === 'password') {
                    inputField.type = 'text';
                    btnEl.innerText = '🙈';
                } else {
                    inputField.type = 'password';
                    btnEl.innerText = '👁️';
                }
            }
        }

        // ==================== LOGIN SCREEN ====================

            return `

                    <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm"></div>
                    
                    <header class="relative z-10 p-6 flex flex-col md:flex-row justify-between items-center text-white border-b border-white/10 gap-4">
                        <h1 class="text-xl md:text-2xl font-black tracking-wider text-center md:text-left drop-shadow-md">CITY PUBLIC SCHOOL, NAJIBABAD</h1>
                        <div id="live-clock-badge" class="bg-slate-900/80 border border-white/20 px-4 py-2 rounded-2xl text-xs font-bold tracking-widest shadow-inner">
                            ${dateStr}
                        </div>
                    </header>

                    <main class="relative z-10 flex-grow flex items-center justify-center p-4 my-6">

                            <div class="text-center mb-8">
                                <h2 class="text-2xl md:text-3xl font-extrabold text-blue-950">Online Examination Portal Login</h2>
                                <p class="text-xs md:text-sm text-slate-500 mt-2 font-medium">Select your role and authenticate using your registered details.</p>
                            </div>

                            <div class="space-y-5">
                                <div>
                                    <div class="flex justify-between items-center mb-2">
                                        <label class="text-xs font-extrabold text-slate-700 uppercase tracking-wider">I am a:</label>
                                        <a href="#" onclick="openRegisterModal()" class="text-xs font-bold text-blue-600 hover:underline">New User? Register Here</a>
                                    </div>
                                    <select id="login-role" onchange="toggleStudentFields()" class="w-full border border-slate-300 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm font-semibold bg-slate-50 cursor-pointer">
                                        <option value="Student">Student</option>
                                        <option value="Teacher">Teacher</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-2">User ID / Registered Email</label>
                                    <input type="text" id="login-username" class="w-full border border-slate-300 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm font-medium bg-slate-50" placeholder="e.g. abc@gmail.com, abc9">

                                    <div class="flex justify-between items-center mb-2">
                                        <label class="text-xs font-extrabold text-slate-700 uppercase tracking-wider">Password</label>

                                    </div>
                                    <div class="relative">
                                        <input type="password" id="login-password" class="w-full border border-slate-300 rounded-2xl p-4 pr-12 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm font-medium bg-slate-50" placeholder="Enter account password">
                                        <button type="button" onclick="togglePasswordVisibility('login-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-lg focus:outline-none">👁️</button>
                                    </div>

                                <div id="student-extra-fields" class="space-y-5">

                                        <select id="login-class" class="w-full border border-slate-300 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm font-semibold bg-slate-50 cursor-pointer">
                                            <option value="Class 9th - Section A">Class 9th - Section A</option>
                                            <option value="Class 9th - Section B">Class 9th - Section B</option>
                                            <option value="Class 10th - Section A">Class 10th - Section A</option>
                                            <option value="Class 10th - Section B">Class 10th - Section B</option>
                                            <option value="Class 11th - Science A">Class 11th - Section A</option>
                                            <option value="Class 11th - Science B">Class 11th - Section B</option>
                                            <option value="Class 12th - Science A">Class 12th - Section A</option>
                                            <option value="Class 12th - Science B">Class 12th - Section B</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-2">Enter Roll Number (1 to 50)</label>
                                        <input type="number" id="login-roll" min="1" max="50" class="w-full border border-slate-300 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm font-medium bg-slate-50" placeholder="e.g. 12">
                                    </div>
                                </div>

                                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition shadow-xl text-sm tracking-wide mt-2">Login & Proceed</button>
                            </div>
                        </div>
                    </main>

                    <footer class="relative z-10 text-slate-400 text-xs py-4 text-center border-t border-white/10 font-medium">
                        &copy; Secure Examination Engine.
                    </footer>
                </div>
            `;
        }

        function toggleStudentFields() {
            const role = document.getElementById('login-role')?.value;
            const extraFields = document.getElementById('student-extra-fields');
            if (extraFields) {
                if (role === 'Student') {
                    extraFields.classList.remove('hidden');
                } else {
                    extraFields.classList.add('hidden');
                }
            }
        }

        function handleLogin() {
            const usernameInput = document.getElementById('login-username').value.trim().toLowerCase();
            const passwordInput = document.getElementById('login-password').value.trim();
            const roleInput = document.getElementById('login-role')?.value || 'Student';

            if (!passwordInput) { alert('Please enter your password.'); return; }

            let adminUser = state.users.find(u => u.role === 'Admin');

            if (usernameInput === 'admin' && adminUser && passwordInput === adminUser.password) {
                state.currentUser = adminUser;
                state.showLoginCountdown = false;
                render();
                return;
            }

            if (!usernameInput) { alert('Please enter User ID or username.'); return; }

            // Safely find user by username first
            let foundUser = state.users.find(u => u.username.toLowerCase() === usernameInput);

            if (!foundUser) {
                alert('User not found. Please check your username or register.');
                return;
            }

            if (foundUser.password !== passwordInput) {
                alert('Incorrect password. Please try again.');
                return;
            }

            if (foundUser.status === 'locked') {
                alert('Your account has been locked due to security violations or multiple device/tab login attempts. Please contact the administrator to unlock it.');
                return;
            }

            // Enforce single-device / single-tab login restriction for students
            if (foundUser.role === 'Student') {
                const sessionKey = 'cps_active_session_' + foundUser.username;
                const existingSession = localStorage.getItem(sessionKey);

                if (existingSession) {
                    foundUser.status = 'locked';
                    saveState();
                    alert('Security Alert: Multiple device or tab login attempt detected! Your account has been locked immediately.');
                    render();
                    return;
                }

                const sessionToken = Date.now() + '_' + Math.random();
                localStorage.setItem(sessionKey, sessionToken);
                foundUser.sessionToken = sessionToken;

                const studentClass = document.getElementById('login-class')?.value || foundUser.class;
                const classExams = state.exams.filter(exam => 
                    exam.class === studentClass || 
                    (exam.targetClasses && exam.targetClasses.includes(studentClass))
                );
                if (classExams.length === 0) {
                    alert('No exam is there for your class.');
                    // Clean up session if login aborted
                    localStorage.removeItem(sessionKey);
                    return;
                }
                foundUser.class = studentClass;
            }

            if (foundUser.role === 'Teacher' && foundUser.status !== 'approved') {
                alert('Your teacher account is pending administrator authorization. Please contact Admin.');
                return;
            }

            state.currentUser = foundUser;
            state.showLoginCountdown = (foundUser.role === 'Student');
            render();
        }

        function logout() {
            if (state.currentUser && state.currentUser.role === 'Student') {
                localStorage.removeItem('cps_active_session_' + state.currentUser.username);
            }
            if (state.activeExamInterval) clearInterval(state.activeExamInterval);
            if (window.loginCountdownInterval) {
                clearInterval(window.loginCountdownInterval);
                window.loginCountdownInterval = null;
            }
            state.currentUser = null;
            state.showLoginCountdown = false;
            render();
        }

        // ==================== MANAGEMENT DASHBOARD ====================
        function renderManagementDashboard() {
            const isTeacher = state.currentUser.role === 'Teacher';
            return `

        function submitDeleteStudent() {
            const query = document.getElementById('del-student-query').value.trim().toLowerCase();
            const cls = document.getElementById('del-student-class').value;

            if (!query && !cls) {
                alert('Please enter student username/name or select a class.');
                return;
            }

            let students = state.users.filter(u => u.role === 'Student');
            let targetStudent = null;

            if (query) {
                targetStudent = students.find(u => 
                    (u.username.toLowerCase() === query || 
                     u.name.toLowerCase() === query || 
                     (u.roll && u.roll.toLowerCase() === query)) &&
                    (!cls || u.class === cls)
                );
            } else if (cls) {
                let classStudents = students.filter(u => u.class === cls);
                if (classStudents.length === 0) {
                    alert('No students found in this class.');
                    return;
                }
                let namesList = classStudents.map(s => `${s.name} (Username: ${s.username})`).join('\n');
                let chosen = prompt(`Students in ${cls}:\n${namesList}\n\nEnter exact Username/ID of student to delete:`);
                if (chosen) {
                    targetStudent = classStudents.find(u => u.username.toLowerCase() === chosen.trim().toLowerCase());
                }
            }

            if (targetStudent) {
                if (confirm(`Are you sure you want to delete student: ${targetStudent.name} (${targetStudent.username})?`)) {
                    localStorage.removeItem('cps_active_session_' + targetStudent.username);
                    state.users = state.users.filter(u => u.username !== targetStudent.username);
                    saveState();
                    closeModal();
                    render();
                    alert(`Student ${targetStudent.name} deleted successfully.`);
                }
            } else {
                alert('Student not found matching the criteria.');
            }
        }

        function downloadClassRoster() {
            const cls = document.getElementById('manage-class-target').value;
            const students = state.users.filter(u => u.role === 'Student' && u.class === cls);
            if (students.length === 0) {
                alert(`No students found in ${cls} to download.`);
                return;
            }
            let csv = 'Name,Username,Class & Section,Roll Number,Status\n';
            students.forEach(s => {
                csv += `"${s.name}","${s.username}","${s.class}","${s.roll || 'N/A'}","${s.status || 'approved'}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `student_roster_${cls.replace(/[^a-zA-Z0-9]/g, '_')}.csv`;
            a.click();
        }

            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const password = document.getElementById('reg-password').value.trim();
            const role = document.getElementById('reg-role').value;
            const subject = role === 'Teacher' ? document.getElementById('reg-subject').value : 'All';
            const cls = role === 'Student' ? document.getElementById('reg-class').value : 'N/A';

        function startExam(id) {
            const exam = state.exams.find(e => e.id === id);
            if (exam.status !== 'LIVE') { alert('Exam is currently offline.'); return; }
            if (!exam.questions || exam.questions.length === 0) { alert('No questions uploaded for this exam yet.'); return; }

            let examQuestions = JSON.parse(JSON.stringify(exam.questions));

            state.currentAttemptExam = { ...exam, questions: examQuestions };
            state.currentQuestionIndex = 0;
            state.studentAnswers = {};
            state.questionStatus = {};
            examQuestions.forEach((q, idx) => { state.questionStatus[idx] = 'unanswered'; });

            renderCBTExamInterface();
            setupAntiCheat();
        }

                            <div class="flex gap-2">
                                <button onclick="prevQuestion()" ${qIndex === 0 ? 'disabled' : ''} class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-5 py-3 rounded-xl text-xs disabled:opacity-50">Previous</button>
                                <button onclick="markForReview(${qIndex})" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-5 py-3 rounded-xl text-xs">Mark for Review & Next</button>
                                ${q.type === 'mcq' ? `<button onclick="clearResponse(${q.id}, ${qIndex})" class="bg-red-50 hover:bg-red-100 text-red-700 font-bold px-4 py-3 rounded-xl text-xs">Clear Response</button>` : ''}
                            </div>
                            <div class="flex gap-2">
                                <button onclick="nextQuestion()" class="bg-blue-950 hover:bg-blue-900 text-white font-bold px-6 py-3 rounded-xl text-xs shadow">Save & Next</button>
                                <button onclick="confirmSubmitExam()" class="bg-green-700 hover:bg-green-800 text-white font-bold px-6 py-3 rounded-xl text-xs shadow">Submit Exam</button>
                            </div>
                        </div>
                    </div>

                    <!-- CBT Question Palette Sidebar -->
                    <div class="w-full md:w-[380px] bg-white rounded-3xl shadow-2xl p-6 border flex flex-col justify-between">
                        <div>
                            <h4 class="font-black text-sm text-blue-950 uppercase tracking-wider mb-4 border-b pb-2">Question Palette</h4>
                            <div class="grid grid-cols-5 gap-2 mb-6">
                                ${exam.questions.map((item, idx) => {
                                    let statusBg = 'bg-slate-100 text-slate-700 border-slate-300';
                                    const st = state.questionStatus[idx];
                                    if (st === 'answered') statusBg = 'bg-green-600 text-white border-green-700';
                                    else if (st === 'marked') statusBg = 'bg-amber-500 text-white border-amber-600';
                                    else if (idx === qIndex) statusBg = 'bg-blue-900 text-white border-blue-950 ring-2 ring-blue-400';

                                    return `
                                        <button onclick="jumpToQuestion(${idx})" class="h-8 rounded-xl font-black text-xs border flex items-center justify-center transition shadow-sm ${statusBg}">${idx + 1}</button>
                                    `;
                                }).join('')}
                            </div>
                            <div class="space-y-2 text-xs font-semibold text-slate-600 border-t pt-4">
                                <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-full bg-green-600 inline-block"></span><span> Answered</span></div>
                                <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-full bg-amber-500 inline-block"></span><span> Marked for Review</span></div>
                                <div class="flex items-center gap-2"><span class="w-4 h-4 rounded-full bg-slate-200 inline-block"></span><span> Not Answered</span></div>
                            </div>
                        </div>
                        <button onclick="confirmSubmitExam()" class="w-full bg-green-700 hover:bg-green-800 text-white font-extrabold py-3.5 rounded-2xl shadow-xl text-xs mt-6">Final Exam Submit</button>
                    </div>
                </div>
            `;

            if (!state.activeExamInterval) {
                let timeLeft = (exam.durationMinutes || 45) * 60;
                state.activeExamInterval = setInterval(() => {
                    timeLeft--;
                    let hrs = Math.floor(timeLeft / 3600).toString().padStart(2, '0');
                    let mins = Math.floor((timeLeft % 3600) / 60).toString().padStart(2, '0');
                    let secs = (timeLeft % 60).toString().padStart(2, '0');
                    const tEl = document.getElementById('exam-timer');
                    if (tEl) tEl.innerText = `${hrs}:${mins}:${secs} remaining`;
                    if (timeLeft <= 0) { clearInterval(state.activeExamInterval); submitActiveExam(); }
                }, 1000);
            }
        }

        function recordMCQAnswer(qId, optIdx, qIndex) {
            state.studentAnswers[qId] = optIdx;
            state.questionStatus[qIndex] = 'answered';
            renderCBTExamInterface();
        }

        function recordDescriptiveAnswer(qId, val) {
            state.studentAnswers[qId] = val;
            const qIndex = state.currentAttemptExam.questions.findIndex(q => q.id === qId);
            if (val.trim().length > 0) {
                state.questionStatus[qIndex] = 'answered';
            } else {
                state.questionStatus[qIndex] = 'unanswered';
            }
        }

        function clearResponse(qId, qIndex) {
            delete state.studentAnswers[qId];
            state.questionStatus[qIndex] = 'unanswered';
            renderCBTExamInterface();
        }

        function nextQuestion() {
            if (state.currentQuestionIndex < state.currentAttemptExam.questions.length - 1) {
                state.currentQuestionIndex++;
                renderCBTExamInterface();
            }
        }

        function prevQuestion() {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                renderCBTExamInterface();
            }
        }

        function jumpToQuestion(idx) {
            state.currentQuestionIndex = idx;
            renderCBTExamInterface();
        }

        function markForReview(idx) {
            state.questionStatus[idx] = 'marked';
            if (idx < state.currentAttemptExam.questions.length - 1) {
                state.currentQuestionIndex++;
            }
            renderCBTExamInterface();
        }

        function setupAntiCheat() {
            state.warningCount = 0;
            window.onblur = function() {
                state.warningCount++;
                if (state.warningCount >= 2) {
                    alert('Max warnings reached due to security violations. Your account has been locked and exam is auto-submitting!');
                    if (state.currentUser) {
                        state.currentUser.status = 'locked';
                        const u = state.users.find(usr => usr.username === state.currentUser.username);
                        if (u) u.status = 'locked';
                        localStorage.removeItem('cps_active_session_' + state.currentUser.username);
                        saveState();
                    }
                    submitActiveExam();
                } else {
                    document.getElementById('security-warning-modal').classList.remove('hidden');
                    document.getElementById('warning-text').innerText = `Warning ${state.warningCount}/2: Leaving exam window or switching tabs is strictly prohibited!`;
                }
            };
        }

        function dismissWarning() { document.getElementById('security-warning-modal').classList.add('hidden'); }

        function confirmSubmitExam() {
            if (confirm('Are you sure you want to finish and submit your final exam?')) {
                submitActiveExam();
            }
        }

        function submitActiveExam() {
            if (state.activeExamInterval) { clearInterval(state.activeExamInterval); state.activeExamInterval = null; }
            window.onblur = null;

            const exam = state.currentAttemptExam;
            let score = 0;
            let totalMCQ = 0;
            let descriptiveAnswered = 0;

            if (exam && exam.questions) {
                exam.questions.forEach(q => {
                    if (q.type === 'mcq') {
                        totalMCQ++;
                        if (state.studentAnswers[q.id] === q.correct) score++;
                    } else if (q.type === 'descriptive') {
                        if (state.studentAnswers[q.id] && state.studentAnswers[q.id].trim().length > 0) {
                            descriptiveAnswered++;
                        }
                    }
                });
            }
            const scoreStr = totalMCQ > 0 ? `${score}/${totalMCQ} MCQ Correct` : `${descriptiveAnswered} Descriptive Answered`;

            state.submissions.push({
                id: Date.now(),
                name: state.currentUser.name,
                class: state.currentUser.class,
                subject: exam.subject || exam.name,
                examId: exam.id,
                score: scoreStr,
                time: new Date().toLocaleString(),
                answers: { ...state.studentAnswers },
                gradedMarks: {}
            });
            saveState();
            alert(`Exam submitted successfully! Score: ${scoreStr}`);
            render();
        }

        function toggleExamStatus(id) {
            const ex = state.exams.find(e => e.id === id);
            if (ex) {
                const newStatus = ex.status === 'LIVE' ? 'OFFLINE' : 'LIVE';
                state.exams.forEach(item => {
                    if (item.subjectId === ex.subjectId || item.subject === ex.subject) {
                        item.status = newStatus;
                    }
                });
                saveState();
                render();
            }
        }

        function purgeClassStudents() {
            const cls = document.getElementById('manage-class-target').value;
            if (confirm(`Are you sure you want to purge all students in ${cls}?`)) {
                const studentsToPurge = state.users.filter(u => u.role === 'Student' && u.class === cls);
                studentsToPurge.forEach(s => localStorage.removeItem('cps_active_session_' + s.username));
                state.users = state.users.filter(u => u.role !== 'Student' || u.class !== cls);
                saveState();
                render();
                alert(`All students in ${cls} purged successfully.`);
            }
        }

        function openAddUserModal() {
            const name = prompt('Enter Student Name:');
            const uname = prompt('Enter Username/ID:');
            const pwd = prompt('Enter Password:');
            if (!pwd) {
                alert('Password is required.'); 
                return; 
            }
            
            const cls = prompt('Enter Class & Section (e.g., Class 9th - Section A):');
            if (name && uname && cls) {
                state.users.push({ id: Date.now(), role: 'Student', class: cls, name: name.toUpperCase(), username: uname, password: pwd, roll: '99', status: 'approved' });
                saveState(); render();
                alert('Student added successfully!');
            }
        }

        function exportCSV() {
            let csv = 'Name,Class & Section,Subject,Score,Time\n';
            state.submissions.forEach(s => csv += `"${s.name}","${s.class}","${s.subject}","${s.score}","${s.time}"\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'cps_submissions.csv'; a.click();
        }

        function runPreview() {
            const subId = document.getElementById('preview-sub-target').value;
            const ex = state.exams.find(e => e.id === subId);
            const box = document.getElementById('preview-box');
            
            let previewQuestions = JSON.parse(JSON.stringify(ex.questions || []));

            document.getElementById('preview-title').innerText = `${ex.name} - ${ex.class || 'All'} Preview (Duration: ${ex.durationMinutes || 45} mins)`;
            document.getElementById('preview-content').innerHTML = previewQuestions.length > 0 ? previewQuestions.map((q, i) => `
                <div class="p-6 bg-slate-50 rounded-2xl border text-xs md:text-sm space-y-3">
                    ${q.caseStudy ? `
                        <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl mb-3">
                            <div class="font-black text-amber-900 text-xs uppercase mb-1">📖 Case Study Passage:</div>
                            <div class="text-xs text-slate-800">${q.caseStudy}</div>
                        </div>
                    ` : ''}
                    <div class="flex justify-between font-bold text-slate-500">
                        <span>Q${i+1}. [${q.type ? q.type.toUpperCase() : 'MCQ'}]</span>
                    </div>
                    <div class="question-body font-bold text-slate-900">${q.q}</div>
                    ${q.type === 'descriptive' ? '<p class="text-xs italic text-blue-700">[Descriptive Answer Textarea Box for Students]</p>' : `<ul class="space-y-1 pl-2">${q.options.map((o, oi) => `<li class="${oi === q.correct ? 'text-green-700 font-bold bg-green-50 p-2 rounded-xl' : 'text-slate-700 p-2'}">• ${o}</li>`).join('')}</ul>`}
                </div>
            `).join('') : '<p class="text-xs text-slate-500">No questions uploaded for this exam yet.</p>';
            box.classList.remove('hidden');
        }

        // ==================== DOCUMENT & MULTI-CLASS SIMULTANEOUS PARSER ====================
        function parseTextToQuestions(textOrHtml, isHtml = false) {
            const questions = [];
            let qId = 1;
            let currentCaseStudy = '';
            let targetRangeStart = null;
            let targetRangeEnd = null;

            const processElementText = (rawText, rawHtml) => {
                const text = rawText.trim();
                if (!text) return;

                const caseStudyMatch = /case\s*study|read\s*the\s*following|passage/i.test(text);
                const rangeMatch = text.match(/questions?\s*(\d+)\s*(?:to|-)\s*(\d+)/i);

                const isQuestion = /^(Q\.?\s*\d+|\d+[\.\)]\s*)/i.test(text);
                const isOption = /^([A-Da-d][\.\)]|\([A-Da-d]\))\s*/.test(text);

                if (caseStudyMatch && !isQuestion && !isOption) {
                    currentCaseStudy = rawHtml || text;
                    targetRangeStart = null;
                    targetRangeEnd = null;
                    if (rangeMatch) {
                        targetRangeStart = parseInt(rangeMatch[1]);
                        targetRangeEnd = parseInt(rangeMatch[2]);
                    }
                    return;
                }

                if (isQuestion) {
                    const qNumMatch = text.match(/^(?:Q\.?\s*)?(\d+)/i);
                    const qNum = qNumMatch ? parseInt(qNumMatch[1]) : qId;

                    let activeCS = currentCaseStudy;
                    if (targetRangeStart !== null && targetRangeEnd !== null) {
                        if (qNum < targetRangeStart || qNum > targetRangeEnd) {
                            activeCS = '';
                        }
                    }

                    questions.push({
                        id: qId++,
                        type: 'descriptive',
                        q: rawHtml || text,
                        options: [],
                        correct: 0,
                        caseStudy: activeCS || undefined
                    });
                } else if (isOption && questions.length > 0) {
                    const lastQ = questions[questions.length - 1];
                    if (lastQ.type === 'descriptive') {
                        lastQ.type = 'mcq';
                        lastQ.options = [];
                    }
                    lastQ.options.push(rawHtml || text);
                } else if (questions.length > 0) {
                    const lastQ = questions[questions.length - 1];
                    if (lastQ.options.length > 0 && !isOption) {
                        lastQ.q += '<br>' + (rawHtml || text);
                    } else if (currentCaseStudy && !lastQ) {
                        currentCaseStudy += '<br>' + (rawHtml || text);
                    } else if (lastQ) {
                        lastQ.q += '<br>' + (rawHtml || text);
                    }
                } else if (currentCaseStudy) {
                    currentCaseStudy += '<br>' + (rawHtml || text);
                }
            };

            if (isHtml) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = textOrHtml;
                Array.from(tempDiv.children).forEach(p => {
                    processElementText(p.textContent, p.innerHTML);
                });
            } else {
                const lines = textOrHtml.split('\n');
                lines.forEach(line => {
                    processElementText(line, line);
                });
            }

            if (questions.length === 0) {
                questions.push({
                    id: 1,
                    type: 'descriptive',
                    q: textOrHtml.substring(0, 400),
                    options: [],
                    correctText: ''
                });
            }

            return questions;
        }

        async function uploadAndParseMultiClassQP() {
            const subjectId = document.getElementById('qp-subject-target').value;
            const subjectName = document.getElementById('qp-subject-target').options[document.getElementById('qp-subject-target').selectedIndex].text;
            const duration = parseInt(document.getElementById('qp-duration-field').value) || 45;
            const startTime = document.getElementById('qp-start-time-field').value;
            const endTime = document.getElementById('qp-end-time-field').value;
            
            const checkedClasses = Array.from(document.querySelectorAll('input[name="target-class-chk"]:checked')).map(cb => cb.value);
            if (checkedClasses.length === 0) {
                alert('Please select at least one target class for this examination paper.');
                return;
            }

            const fileInput = document.getElementById('qp-file-field');
            if (fileInput.files.length === 0) {
                alert('Please select a question paper file to upload.');
                return;
            }

            const file = fileInput.files[0];
            const fileName = file.name.toLowerCase();

            try {
                let parsedQuestions = [];

                if (fileName.endsWith('.json')) {
                    const text = await file.text();
                    parsedQuestions = JSON.parse(text);
                } else if (fileName.endsWith('.txt')) {
                    const text = await file.text();
                    parsedQuestions = parseTextToQuestions(text, false);
                } else if (fileName.endsWith('.docx') || fileName.endsWith('.doc')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer }, {
                        convertImage: mammoth.images.imgElement(function(image) {
                            return image.read("base64").then(function(imageBuffer) {
                                return {
                                    src: "data:" + image.contentType + ";base64," + imageBuffer
                                };
                            });
                        })
                    });
                    parsedQuestions = parseTextToQuestions(result.value, true);
                } else if (fileName.endsWith('.pdf')) {
                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    const arrayBuffer = await file.arrayBuffer();
                    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                    const pdfDoc = await loadingTask.promise;
                    let fullText = '';
                    for (let i = 1; i <= pdfDoc.numPages; i++) {
                        const page = await pdfDoc.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                    }
                    parsedQuestions = parseTextToQuestions(fullText, false);
                } else {
                    alert('Unsupported file format. Please upload .json, .txt, .docx, or .pdf files.');
                    return;
                }

                // Simultaneously create or update exam entries for all selected classes with start time and end time
                checkedClasses.forEach(cls => {
                    const examId = `${subjectId}_${cls.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
                    let existingExamIndex = state.exams.findIndex(e => e.id === examId || (e.subjectId === subjectId && e.class === cls));

                    if (existingExamIndex >= 0) {
                        state.exams[existingExamIndex].questions = parsedQuestions;
                        state.exams[existingExamIndex].durationMinutes = duration;
                        state.exams[existingExamIndex].startTime = startTime;
                        state.exams[existingExamIndex].endTime = endTime;
                        state.exams[existingExamIndex].name = `${subjectName} - ${cls}`;
                    } else {
                        state.exams.push({
                            id: examId,
                            subjectId: subjectId,
                            name: `${subjectName} - ${cls}`,
                            subject: subjectName,
                            class: cls,
                            status: 'OFFLINE',
                            startTime: startTime,
                            endTime: endTime,
                            durationMinutes: duration,
                            questions: parsedQuestions
                        });
                    }
                });

                saveState();
                alert(`Successfully uploaded and assigned ${subjectName} question paper (${parsedQuestions.length} questions) to ${checkedClasses.length} classes simultaneously!`);
                render();

            } catch (err) {
                console.error(err);
                alert('Error parsing uploaded file: ' + err.message);
            }
        }

        render();
    </script>
